[package]
name = "stab-algebra"
version.workspace = true
edition.workspace = true
rust-version = "1.97.1"
description = "Stable Pauli, Clifford, tableau, and stabilizer-flow algebra for Stab."
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[features]
default = []
portable-simd = ["dep:stab-kernels-simd", "stab-bits/portable-simd"]

[dependencies]
num-complex = { workspace = true }
rand = { workspace = true }
stab-bits = { workspace = true }
stab-kernels-simd = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
allocation-counter = { workspace = true }
proptest = { workspace = true }
