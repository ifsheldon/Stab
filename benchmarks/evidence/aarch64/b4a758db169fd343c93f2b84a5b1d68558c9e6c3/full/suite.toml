schema_version = 1
expected_release_families = 12
expected_release_cases = 29

[stim]
version = "v1.16.0"
commit = "e2fc1eca7fd21684d433aa5f10f4504ea4860d07"

[policy]
timing_boundary = "e2e-user-workflow-v2"
parity_max_ratio = 1.25
self_regression_max_ratio = 1.15
bootstrap_seed = 6004497137074745393
bootstrap_resamples = 10000
confidence_level = 0.95
maximum_temperature_millidegrees = 100000
maximum_output_bytes = 67108864
command_timeout_seconds = 600

[tiers.smoke]
warmups = 0
samples = 1

[tiers.full]
warmups = 2
samples = 9

[tiers.soak]
warmups = 3
samples = 21

