name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
          fetch-tags: true

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes build-essential cmake

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.2"

      - name: Install just
        run: cargo install just --version 1.58.0 --locked

      - name: Show toolchain
        run: rustup show active-toolchain

      - name: Architecture
        run: |
          just architecture::check
          just architecture::consumer-check
          just architecture::docs-check

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --config "build.warnings='deny'"

      - name: Public API documentation
        run: just docs::api-check

      - name: Test
        run: cargo test --workspace --locked

      - name: Oracle version
        run: just oracle::version

      - name: Oracle help smoke
        run: just oracle::run --case smoke/help

      - name: Oracle tiny circuit smoke
        run: just oracle::run --case smoke/tiny-circuit

      - name: E2E benchmark contract
        run: just bench::e2e-check

  contracts:
    name: Compatibility Contracts
    # Pinned Stim prints DEM decimals with long double precision, which is 34
    # digits only on 128-bit long double hosts such as the AArch64 baseline.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
          fetch-tags: true

      - name: Install rustup when the runner image lacks it
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes build-essential cmake

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.2"

      - name: Install just
        run: cargo install just --version 1.58.0 --locked

      - name: Check generated Stim parity view
        run: just oracle::parity-render --check

      - name: Check Stim parity ledger and all evidence selectors
        run: just oracle::parity-check

      - name: Build and check pinned Stim gate oracle
        run: just oracle::gates

      - name: Run pinned Stim probes
        run: cargo test --locked -p stab-oracle -- --ignored pinned_stim

      - name: Run parity owners
        run: just oracle::parity-run

      - name: Run live pinned Stim fixtures
        run: just oracle::run --all-rows

      - name: Check E2E performance contract
        run: just bench::e2e-check

      - name: Check pinned result-format corpus
        run: just oracle::result-formats --check
