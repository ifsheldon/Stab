name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
          fetch-tags: true

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes build-essential cmake

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.2"

      - name: Install just
        run: cargo install just --version 1.58.0 --locked

      - name: Show toolchain
        run: rustup show active-toolchain

      - name: Install Stable component toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Architecture
        run: |
          just architecture::check
          just architecture::consumer-check
          just architecture::docs-check

      - name: Stable component tests
        run: cargo +1.97.1 test --locked -p stab-bits -p stab-records -p stab-algebra -p stab-model -p stab-analysis -p stab-engine -p stab-decoder -p stab-reference-decoder -p stab-reference-noise-pass --all-targets

      - name: Portable SIMD component tests
        run: cargo test --locked -p stab-bits -p stab-algebra --no-default-features --features portable-simd

      - name: Portable SIMD Clippy
        run: cargo clippy --locked -p stab-bits -p stab-algebra --no-default-features --features portable-simd --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Public API documentation
        run: just docs::api-check

      - name: Test
        run: cargo test --workspace

      - name: Oracle version
        run: just oracle::version

      - name: Oracle help smoke
        run: just oracle::run --case smoke/help

      - name: Oracle tiny circuit smoke
        run: just oracle::run --case smoke/tiny-circuit

      - name: Benchmark smoke
        run: just bench::smoke

  contracts:
    name: Qualification Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
          fetch-tags: true

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes build-essential cmake

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.2"

      - name: Install just
        run: cargo install just --version 1.58.0 --locked

      - name: Check correctness inventory
        run: just qualification::correctness-check

      - name: Check generated Stim parity view
        run: just oracle::parity-render --check

      - name: Check Stim parity ledger and all evidence selectors
        run: just oracle::parity-check

      - name: Run PR-tier parity owners
        run: just oracle::parity-run --tier pr

      - name: Check performance inventory
        run: just bench::qualification-check

      - name: Check generated qualification status
        run: just qualification::status --check

      - name: Check oracle fixture matrix
        run: just oracle::matrix --check

      - name: Check pinned result-format corpus
        run: just oracle::result-formats --check
