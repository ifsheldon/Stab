name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to receive the binaries
        required: true
        type: string

permissions:
  contents: write

jobs:
  stab:
    name: Build stab (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: macos-aarch64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Show toolchain
        run: rustup show active-toolchain

      - name: Build stab
        run: cargo build --release --locked -p stab-cli

      - name: Package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: cargo run -q --locked -p stab-release -- package-binary --binary target/release/stab --target ${{ matrix.name }} --out dist --tag "$RELEASE_TAG"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
