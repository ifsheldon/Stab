name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to build into a draft release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build stab (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: macos-aarch64
            os: macos-15-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Show toolchain
        run: rustup show active-toolchain

      - name: Build and validate tagged binary
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TARGET: ${{ matrix.name }}
        run: cargo run -q --locked -p stab-release -- build-binary --target "$RELEASE_TARGET" --out "target/releases/binary-$RELEASE_TARGET" --tag "$RELEASE_TAG"

      - name: Retain validated assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stab-${{ matrix.name }}
          path: target/releases/binary-${{ matrix.name }}/*
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Verify assets and create draft
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download all validated assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: stab-*
          merge-multiple: true
          path: target/releases/assets

      - name: Verify complete asset set
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: cargo run -q --locked -p stab-release -- verify-assets --assets target/releases/assets --tag "$RELEASE_TAG"

      - name: Create draft release with immutable asset names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" target/releases/assets/stab-linux-aarch64 target/releases/assets/stab-linux-aarch64.sha256 target/releases/assets/stab-linux-aarch64.json target/releases/assets/stab-macos-aarch64 target/releases/assets/stab-macos-aarch64.sha256 target/releases/assets/stab-macos-aarch64.json --draft --verify-tag --title "Stab 0.2.0" --notes "Stab 0.2.0"
