name: M12 Diagnostic Performance Trend

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  diagnostic-trend:
    name: Diagnostic Performance Trend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes build-essential cmake

      - name: Install just
        run: cargo install just --locked

      - name: Show toolchain
        run: rustup show active-toolchain

      - name: Record primary baseline
        env:
          RUSTFLAGS: -C target-cpu=native
        run: just bench::baseline --primary --out target/benchmarks/m12-scheduled-primary-baseline

      - name: Record diagnostic threshold trend
        env:
          RUSTFLAGS: -C target-cpu=native
        run: just bench::primary-regression --baseline target/benchmarks/m12-scheduled-primary-baseline/baseline.json --report target/benchmarks/m12-scheduled-primary-regression

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m12-diagnostic-performance-trend
          path: |
            target/benchmarks/m12-scheduled-primary-baseline/baseline.json
            target/benchmarks/m12-scheduled-primary-baseline/report.md
            target/benchmarks/m12-scheduled-primary-regression/compare.json
            target/benchmarks/m12-scheduled-primary-regression/report.md
          if-no-files-found: ignore
