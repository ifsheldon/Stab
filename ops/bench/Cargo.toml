[package]
name = "stab-bench"
version.workspace = true
edition.workspace = true
description = "Benchmark orchestration for pinned Stim and Stab performance contracts."
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[features]
default = []
count-allocations = ["dep:allocation-counter"]
portable-simd = ["stab-cli/portable-simd", "stab-core/portable-simd"]

[lints]
workspace = true

[dependencies]
allocation-counter = { workspace = true, optional = true }
clap = { workspace = true }
csv = { workspace = true }
hex = { workspace = true }
memory-stats = { workspace = true }
rand = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
signal-hook = { workspace = true }
stab-analysis = { workspace = true }
stab-cli = { path = "../../crates/stab-cli", default-features = false }
stab-core = { path = "../../crates/stab-core", default-features = false }
stab-decoder = { workspace = true }
stab-engine = { workspace = true }
stab-model = { workspace = true }
stab-records = { workspace = true }
stab-reference-decoder = { path = "../../test-support/reference-decoder" }
stab-reference-noise-pass = { path = "../../test-support/reference-noise-pass" }
tempfile = { workspace = true }
thiserror = { workspace = true }
