[workspace]
resolver = "3"
members = [
    "crates/stab-algebra",
    "crates/stab-analysis",
    "crates/stab-bits",
    "crates/stab-cli",
    "crates/stab-core",
    "crates/stab-decoder",
    "crates/stab-engine",
    "crates/stab-kernels-simd",
    "crates/stab-model",
    "crates/stab-records",
    "ops/architecture",
    "ops/bench",
    "ops/oracle",
    "ops/pre-commit",
    "ops/release",
    "test-support/compat-corpus",
    "test-support/reference-decoder",
    "test-support/reference-noise-pass",
]
default-members = [
    "crates/stab-core",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ifsheldon/Stab"
homepage = "https://github.com/ifsheldon/Stab"
readme = "README.crates.md"
keywords = ["quantum-computing", "error-correction", "stabilizer", "simulation"]

[workspace.dependencies]
allocation-counter = "0.8.1"
arrayvec = "0.7.8"
cargo_metadata = "0.23.1"
clap = { version = "4.6.1", features = ["derive"] }
crates-io = "0.41.0"
csv = "1.4.0"
flate2 = "1.1.9"
gix = "0.85.0"
hashbrown = "0.17.1"
hex = "0.4.3"
ignore = "0.4.26"
memory-stats = "1.2.0"
num-complex = "0.4.6"
object = { version = "0.40.0", default-features = false, features = ["read", "std"] }
proptest = "1.11.0"
proc-macro2 = "1.0.107"
pulldown-cmark = { version = "0.13.4", default-features = false }
rand = "0.10.1"
rustix = { version = "1.1.4", features = ["fs", "process", "thread"] }
same-file = "1.0.6"
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["float_roundtrip"] }
sha2 = "0.11.0"
signal-hook = "0.4.4"
smallvec = { version = "1.15.2", features = ["union"] }
syn = { version = "3.0.3", default-features = false, features = ["full", "parsing"] }
stab-algebra = { path = "crates/stab-algebra", version = "=0.2.0" }
stab-analysis = { path = "crates/stab-analysis", version = "=0.2.0" }
stab-bits = { path = "crates/stab-bits", version = "=0.2.0" }
stab-cli = { path = "crates/stab-cli", version = "=0.2.0" }
stab-core = { path = "crates/stab-core", version = "=0.2.0", default-features = false }
stab-decoder = { path = "crates/stab-decoder", version = "=0.2.0" }
stab-engine = { path = "crates/stab-engine", version = "=0.2.0" }
stab-kernels-simd = { path = "crates/stab-kernels-simd", version = "=0.2.0" }
stab-model = { path = "crates/stab-model", version = "=0.2.0" }
stab-records = { path = "crates/stab-records", version = "=0.2.0" }
stab-architecture = { path = "ops/architecture" }
statrs = { version = "0.18.0", default-features = false }
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["io-util", "macros", "process", "rt-multi-thread", "signal"] }
unicode-general-category = "1.1.0"
ureq = "3.3.0"
yaml-rust2 = "0.11.0"

[workspace.lints.rust]
let_underscore_drop = "warn"
linker_messages = "allow"
missing_debug_implementations = "warn"
redundant_imports = "warn"
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
allow_attributes_without_reason = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
enum_glob_use = "warn"
expl_impl_clone_on_copy = "warn"
expect_used = "warn"
future_not_send = "warn"
indexing_slicing = "warn"
infallible_try_from = "warn"
invalid_upcast_comparisons = "warn"
iter_not_returning_iterator = "warn"
let_underscore_future = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
panic = "warn"
panic_in_result_fn = "warn"
rc_mutex = "warn"
string_slice = "warn"
todo = "warn"
unimplemented = "warn"
unchecked_time_subtraction = "warn"
unused_async = "warn"
unwrap_used = "warn"
wildcard_imports = "warn"
