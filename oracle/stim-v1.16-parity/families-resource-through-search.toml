## Resource-safety and search parity families.

[[families]]
id = "resource-safety.algebra-size-limits"
area = "resource-safety"
contract = "Algebra values built from a requested size, including Pauli strings and iterators, Tableaux, random Tableaux, and the stabilizer solver's working rows, are admitted in bytes against a typed algebra memory budget, admitting the exact requirement and refusing the first excess byte before allocation or RNG consumption, while flow terms and unitary conversion are bounded by their input and no width is capped."
stim_refs = ["src/stim/stabilizers/pauli_string.test.cc", "src/stim/stabilizers/tableau.test.cc", "src/stim/util_top/stabilizers_to_tableau.test.cc"]
status = "divergence"
owner = "stab-algebra"
divergence_kind = "resource-limit"
rationale = "Stim allocates algebra values of any width and relies on host allocation failure; Stab refuses a projected value above its one-gibibyte default algebra memory budget with a typed error before allocating, and otherwise accepts every width Stim accepts."
[families.evidence]
status = "verified"
[families.evidence.test]
package = "stab-algebra"
kind = "test"
target = "cq2_algebra_resources"
name = "algebra_byte_admission_refuses_before_allocation_or_rng_use"

