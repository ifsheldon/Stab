status = "divergence"
owner = "stab-analysis"
divergence_kind = "stab-extension"
rationale = "Pinned Stim reroutes these maxima to its graphlike search with ungraphlike errors ignored, which drops every error containing a separator and so can report no logical error where one within the stated maxima exists. By design Stab keeps the fast two-detector search but uses the hypergraph edge rules, so the result honors the maxima; models without separators or repeated targets return Stim's witness. No Stim command reaches the search, so there is no pinned reproduction."
[families.evidence]
status = "verified"
[families.evidence.test]
package = "stab-analysis"
kind = "test"
target = "dem_search"
name = "hypergraph_search_with_both_maxima_two_folds_separated_errors"

