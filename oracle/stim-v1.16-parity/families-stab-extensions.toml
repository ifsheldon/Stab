[[families]]
id = "stab-extensions.agent-capabilities"
area = "stab-extensions"
contract = "The capabilities command emits source-derived product, command, format, backend, and limit discovery in a stable machine-readable schema."
stim_refs = ["doc/usage_command_line.md"]
coverage = ["extension:agent-capabilities"]
status = "divergence"
owner = "stab-cli"
divergence_kind = "stab-extension"
rationale = "Stim has no machine-readable command that exposes Stab's component and capability graph."
[families.evidence]
status = "verified"
[families.evidence.test]
package = "stab-cli"
kind = "lib"
name = "tests::agent::capabilities_json_is_generated_from_product_and_clap_descriptors"
minimum_tier = "pr"

