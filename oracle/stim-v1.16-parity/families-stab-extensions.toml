[[families]]
id = "stab-extensions.model-approximate-equality-typed-tolerance"
area = "stab-extensions"
contract = "Rust approximate-equality APIs accept a shared finite nonnegative AbsoluteTolerance value and reject negative, NaN, and infinite external values before comparison."
stim_refs = ["doc/stim.pyi", "src/stim/circuit/circuit.pybind.cc", "src/stim/dem/detector_error_model.pybind.cc"]
status = "divergence"
owner = "stab-model"
divergence_kind = "stab-extension"
rationale = "The Rust API eliminates invalid absolute-tolerance states instead of exposing Stim's undocumented IEEE comparison results for negative and non-finite tolerances."
[families.evidence]
status = "verified"
[families.evidence.test]
package = "stab-model"
kind = "test"
target = "approximate_equality"
name = "absolute_tolerance_rejects_invalid_numeric_domains"
minimum_tier = "pr"

