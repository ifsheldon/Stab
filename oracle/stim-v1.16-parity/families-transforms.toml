minimum_tier = "pr"

[[families]]
id = "transforms.time-reversal-for-flows-duplicate-reset-indexing"
area = "transforms"
contract = "Duplicate reset and measure-reset targets reverse by disjoint target segment and return flows whose record indexes are valid for the returned circuit."
stim_refs = ["src/stim/util_top/circuit_inverse_qec.test.cc"]
status = "divergence"
owner = "stab-analysis"
divergence_kind = "stim-bug"
rationale = "Pinned Stim loops over the full instruction for every disjoint duplicate-target segment and can return rec[-4] for a two-measurement inverse; Stab indexes each segment once and validates the corrected flow."
[families.evidence]
status = "verified"
[families.evidence.test]
package = "stab-analysis"
kind = "test"
target = "circuit_inverse_qec"
name = "time_reversed_for_flows_preserves_duplicate_reset_semantics"
minimum_tier = "pr"
[families.evidence.stim_reproduction]
package = "stab-oracle"
kind = "bin"
target = "stab-oracle"
name = "parity::tests::pinned_stim::pinned_stim_inverse_qec_misindexes_duplicate_reset_flows"
minimum_tier = "pr"

[[families]]
id = "transforms.time-reversal-for-flows-observable-dependencies"
area = "transforms"
contract = "Time reversal rejects a surviving obs[k] term in a supplied flow before expansion instead of silently dropping that dependency from the returned flow."
stim_refs = ["src/stim/util_top/circuit_inverse_qec.inl", "src/stim/util_top/circuit_inverse_qec.test.cc"]
status = "divergence"
owner = "stab-analysis"
divergence_kind = "stim-bug"
rationale = "Pinned Stim stores the input observable list but neither seeds it into reverse tracking nor emits it in the returned flow. Stab rejects this under-specified operation instead of reporting a lossy success."
[families.evidence]
status = "verified"
[families.evidence.test]
package = "stab-analysis"
kind = "test"
target = "circuit_inverse_qec"
name = "time_reversed_for_flows_rejects_observable_dependencies_before_expansion"
minimum_tier = "pr"
[families.evidence.stim_reproduction]
package = "stab-oracle"
kind = "bin"
target = "stab-oracle"
name = "parity::tests::pinned_stim::pinned_stim_inverse_qec_silently_drops_flow_observables"
minimum_tier = "pr"

