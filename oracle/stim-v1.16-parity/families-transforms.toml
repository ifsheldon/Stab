minimum_tier = "pr"

[[families]]
id = "transforms.feedback-inlining-mixed-classical-cz"
area = "transforms"
contract = "Feedback inlining removes mixed measurement-record and sweep-bit CZ no-ops instead of interpreting the sweep id as a qubit."
stim_refs = ["src/stim/util_top/transform_without_feedback.cc"]
status = "divergence"
owner = "stab-analysis"
divergence_kind = "stim-bug"
rationale = "Pinned Stim tests only whether one CZ target is a measurement record and then calls qubit_value on the other target; a sweep id can therefore become a spurious qubit sensitivity. Stab classifies both targets as classical and removes the semantic no-op."
[families.evidence]
status = "verified"
[families.evidence.test]
package = "stab-analysis"
kind = "lib"
target = "stab_analysis"
name = "circuit_feedback::tests::circuit_with_inlined_feedback_drops_classical_cz_noops_with_record_targets"
minimum_tier = "pr"
[families.evidence.stim_reproduction]
package = "stab-oracle"
kind = "bin"
target = "stab-oracle"
name = "parity::tests::pinned_stim::pinned_stim_feedback_transform_mistakes_a_sweep_target_for_a_qubit"
minimum_tier = "pr"

[[families]]
id = "transforms.feedback-inlining-xcz-ycz-controls"
area = "transforms"
contract = "Feedback inlining accepts XCZ and YCZ record-control orientations by lowering them to the equivalent controlled-X and controlled-Y semantics."
stim_refs = ["src/stim/util_top/transform_without_feedback.cc"]
status = "divergence"
owner = "stab-analysis"
divergence_kind = "stab-extension"
rationale = "Pinned Stim's feedback transform omits XCZ and YCZ dispatch even though the gate dialect defines equivalent controlled-Pauli orientations; Stab accepts the typed equivalents."
[families.evidence]
status = "verified"
[families.evidence.test]
package = "stab-analysis"
kind = "lib"
target = "stab_analysis"
name = "circuit_feedback::tests::feedback_inlining_xcz_ycz_extension_matches_equivalent_controls"
minimum_tier = "pr"

