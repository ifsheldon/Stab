area = "transforms"
contract = "Time reversal for flows supports folded unitary, measurement-rich, circuit-observable, coordinate, product-measurement, MPAD, heralded-record, ordinary-noise, generated-code, duplicate-measurement, and bounded-repeat workflows when supplied flows contain no observable dependencies; supplied signs are accepted and normalized, while record feedback is rejected, matching pinned Stim."
stim_refs = ["src/stim/util_top/circuit_inverse_qec.test.cc"]
status = "done"
owner = "stab-analysis"
[families.evidence]
status = "verified"
[families.evidence.test]
