## Transform parity families.

[[families]]
id = "transforms.circuit-decomposition-common"
area = "transforms"
contract = "Circuit decomposition is the sole public base-gate lowering operation and preserves ISWAP, MPP, SPP, pair-measurement, constant-product, noise, annotation, tag, repeat, and flow semantics."
stim_refs = ["src/stim/circuit/gate_decomposition.test.cc"]
coverage = ["capability:circuit-simplification", "consumer:transform"]
status = "done"
owner = "stab-analysis"
[families.evidence]
status = "verified"
[families.evidence.test]
package = "stab-oracle"
kind = "bin"
target = "stab-oracle"
name = "parity::tests::catalog_semantics::p5_catalog_base_gate_decomposition_matches_pinned_stim"
minimum_tier = "pr"

