[[families]]
id = "transforms.feedback-inlining-common"
area = "transforms"
contract = "Feedback inlining preserves Stim-accepted demolition, interleaved ordering, MPP, every record-controlled CX, CY, and CZ orientation, and compact nested-repeat semantics under one aggregate work limit."
stim_refs = ["src/stim/util_top/transform_without_feedback.test.cc"]
