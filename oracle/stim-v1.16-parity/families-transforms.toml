[[families]]
id = "transforms.inverse-qec-negative-zero-record"
area = "transforms"
contract = "Inverse-QEC rejects rec[-0] declarations instead of synthesizing extra measurements from a zero-lookback alias."
stim_refs = ["src/stim/util_top/circuit_inverse_qec.test.cc"]
status = "divergence"
owner = "stab-analysis"
divergence_kind = "stim-bug"
rationale = "Pinned Stim accepts rec[-0] during inverse QEC and rewrites it into duplicate measurements even though zero is not a valid backward record offset; Stab rejects the malformed boundary."
[families.evidence]
status = "verified"
[families.evidence.test]
package = "stab-analysis"
kind = "test"
target = "circuit_inverse_qec"
name = "inverse_qec_rejects_negative_zero_record_offsets"
minimum_tier = "pr"
[families.evidence.stim_reproduction]
package = "stab-oracle"
kind = "bin"
target = "stab-oracle"
name = "parity::tests::pinned_stim::pinned_stim_inverse_qec_rewrites_negative_zero_records"
minimum_tier = "pr"

